name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  doctor:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        name: "Install dependencies"
      - run: node src/index.js doctor
        name: "Doctor check"

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        name: "Install dependencies"
      - run: npm test
        name: "Unit tests (Node)"

  # PRD51 S51.10.2 (§51.10, dimensão "Node suportado mínimo, LTS atual e versão usada no
  # release"): as três versões só rodavam no job `doctor`, que executa UM comando. A suíte
  # rodava exclusivamente em Node 22 — uma regressão exclusiva do Node 18 passaria batido.
  # Aqui a suíte INTEIRA roda no mínimo e no LTS. Fica no Linux de propósito: a matriz
  # 3 SOs × 3 Node triplicaria o custo de CI para cobrir uma combinação improvável
  # (incompatibilidade de versão de Node que só se manifesta num SO). Recorte declarado
  # em src/release/rc-matrix.js, não inferido.
  test-node-matrix:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        name: "Install dependencies"
      - run: npm test
        name: "Unit tests (Node ${{ matrix.node }})"

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        name: "Install dependencies"
      - run: pip install pytest
        name: "Install pytest"
      - run: python -m pytest tests/ -v
        name: "Unit tests (Python)"
      - run: npm run coverage:ci
        name: "Coverage gate (c8, baseline ≥70%)"

  # PRD51 S51.6.1 (ação #2): publica o placar REAL do commit (nunca um número
  # fixo em doc) na aba Actions da run, via GITHUB_STEP_SUMMARY.
  dream-scoreboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        name: "Install dependencies"
      - run: npm run dream:scoreboard
        name: "Dream scoreboard do commit"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check ESM imports
        run: grep -rn 'require(' src/ --include='*.js' && exit 1 || exit 0
      - name: Check no hardcoded paths
        # Pega path absoluto de home REAL (em string literal); ignora linhas de comentário
        # (// ou *) que só DESCREVEM o conceito — ex.: workspace.js documenta a heurística
        # HOME-like citando /Users//home sem hardcodear nada.
        # Exclui `/home/casdoor`: é o path INTERNO do container Docker do Casdoor (onde o
        # uid1000 tem permissão de escrita — PRD45 S45.0), não path de máquina de dev.
        run: grep -rn '/Users/\|/home/' src/ --include='*.js' | grep -vE ':[0-9]+:[[:space:]]*(//|\*)' | grep -v '/home/casdoor' && exit 1 || exit 0
      - name: Check shebang
        run: head -1 src/index.js | grep -q '#!/usr/bin/env node'
      - name: Agent Factory drift guard (PRD 13 PR13.1)
        run: npm run build:agents -- --check
      - name: Command-lint (README só cita comando que existe — PRD30 F7-A)
        run: npm run lint:commands
      # PRD51 S51.9.2: o typecheck REAL (tsc --noEmit) não rodava em CI nenhuma —
      # `typecheck` era o mesmo `node --check` do syntaxcheck. Precisa de `npm ci`
      # porque o tsc é devDependency (os passos acima são node puro, sem deps).
      - name: Install dependencies (para o tsc)
        run: npm ci
      - name: Typecheck REAL (tsc --noEmit; bloqueia erro de tipo nos arquivos // @ts-check)
        run: npm run typecheck
      - name: Syntaxcheck (node --check em todo o src — separado do typecheck)
        run: npm run syntaxcheck
      # PRD51 Fase 1B / Fatia 6: o registry é 100% GERADO, e um artefato gerado
      # que ninguém confere vira mentira commitada — o runtime passaria a ler
      # classificações que o código-fonte já não produz.
      #
      # `check` e NUNCA `generate`: o CI precisa REPROVAR quem esqueceu de
      # regenerar, não consertar por baixo. Um CI que regenera esconde
      # exatamente o erro que este passo existe para pegar, e ainda produziria
      # um build cujo artefato difere do commit que o originou.
      - name: i18n registry fresco (regenera em tmp e compara com o commitado)
        run: npm run i18n:registry:check

  # PRD51 S51.10.2 (§51.10, "pacote TGZ passa clean-machine E2E nos três sistemas"):
  # o `test:pack` — que prova o TARBALL real, e pegaria p.ex. o strip do .gitignore pelo
  # npm — rodava SÓ no ubuntu, dentro do job `templates`. O job `e2e` cobre três SOs, mas
  # roda o lifecycle, não o empacotamento. Um defeito de empacotamento específico de
  # Windows (caminhos, permissões, CRLF) passaria batido. Agora é job próprio na matriz.
  pack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        name: "Install dependencies"
      - run: npm run test:pack
        name: "Pack smoke (tarball real)"

  # Scaffold: `test:templates` valida o scaffold lite. O build PESADO (turbo via pnpm)
  # garante que o projeto fullstack gerado COMPILA — fica no ubuntu por custo.
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
        name: "Enable corepack (pnpm)"
      - run: npm ci
        name: "Install dependencies"
      - run: npm run test:templates
        name: "Template smoke (scaffold lite)"
      - run: GSTACK_TEMPLATE_INSTALL=1 npm run test:templates
        name: "Template build PESADO (fullstack lite: pnpm install + turbo build)"
        timeout-minutes: 15

  # E2E lifecycle CROSS-OS (PRD 12 PR8): caixa-preta do produto PUBLICADO. Empacota
  # o tarball, instala num projeto temp e roda o BIN num HOME descartável pelo ciclo
  # doctor → dream audit → create → agents check → install --audit-only → uninstall.
  # Prova em Linux/Windows/macOS: (1) o truth contract no tarball == repo (parity de
  # contagens REAL/PARTIAL/PLACEBO do commit atual — guard do fix v3.21.1, nunca um
  # número fixo desde PRD51 S51.0A/S51.6.1); (2) isolamento de HOME (read-only e
  # create não escrevem config gstack; --save-report grava só o relatório).
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        name: "Install dependencies"
      - run: npm run test:e2e:lifecycle
        name: "E2E lifecycle (tarball → HOME fake → ciclo de vida)"
        env:
          GSTACK_E2E_LIFECYCLE: "1"
        timeout-minutes: 10
      # PRD50 S50.7: protocolo epistêmico pelo BINÁRIO real, nos 3 SOs.
      # Prova: research validate produz review válido, nunca alega fonte sem
      # --network, não escreve no HOME, e o JSON é puro.
      - run: node --test tests/e2e/epistemic_protocol.e2e.test.js
        name: "E2E epistêmico (research validate / consult, cross-OS)"
        timeout-minutes: 5
